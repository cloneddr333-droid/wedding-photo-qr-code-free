<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Google Drive</title>

    <style>
        body{
            margin: 0;
            font-family: arial, sans-serif;
            background: #f5f7fb;
        }
        .container{
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }
        .card{
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0.5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .btn{
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .back{
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">☁️</div>
            <h1>Connect Google Drive</h1>
            <p>
                Connect your Google Drive account to store your wedding photos directly in Drive.
            </p>
            <p>
                You will be redirected to Google for secure authorization.
            </p>
            <a href="{% url 'google_drive_connect' %}" class="btn">
                Continue with Google
            </a>
            <br>
            <a href="{% url 'google_drive' %}" class="back">
                +Back
            </a>
        </div>
    </div>
</body>
</html>
